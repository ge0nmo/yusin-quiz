spring:
  profiles:
    active: local
    group:
      local: local, common, secret
      blue: blue, common, secret
      green: green, common, secret

server:
  env: blue

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 8080
  serverAddress: localhost

serverName: local_server

---

spring:
  config:
    activate:
      on-profile: blue

server:
  port: 8080
  serverAddress: 13.124.70.40

serverName: blue_server

---

spring:
  config:
    activate:
      on-profile: green

server:
  port: 8081
  serverAddress: 13.124.70.40

serverName: green_server

---
spring:
  config:
    activate:
      on-profile: common
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  mvc:
    static-path-pattern: /static/**

app:
  security:
    cors:
      allowed-origins: http://localhost:3000,http://127.0.0.1:3000,https://admin.finuminu.com,https://finuminu.com,https://www.finuminu.com
  version-policy:
    qualification-exams:
      APPRAISER:
        ANDROID:
          latest-version: 2.0.0
          minimum-version: 2.0.0
          store-url: https://play.google.com/store/apps/details?id=com.yusin.quiz
        IOS:
          latest-version: 2.0.0
          minimum-version: 0.0.0
          store-url: ""

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: "/api/actuator"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
